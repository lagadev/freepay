<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Donate · FreePay</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div id="navSlot"></div>
<div class="page narrow">
  <h1 class="pagetitle">Donate</h1>
  <p class="pagesub">FreePay ফ্রি রাখতে সাহায্য করতে চাইলে নিচের নাম্বারে ডোনেট করতে পারেন — সম্পূর্ণ ঐচ্ছিক 💜</p>

  <div class="card" id="donateCard"><div class="empty">লোড হচ্ছে...</div></div>
</div>
<script src="/assets/app.js"></script>
<script>
(async function () {
  const user = await PL.requireAuth("donate");
  if (!user) return;
  const r = await PL.api("/config/public");
  const card = document.getElementById("donateCard");
  if (!r.ok) { card.innerHTML = '<div class="empty">লোড করা যায়নি।</div>'; return; }
  const { donateBkash, donateNagad, donateNote } = r.data;
  if (!donateBkash && !donateNagad) { card.innerHTML = '<div class="empty">এখনো কোনো ডোনেট নাম্বার সেট করা হয়নি।</div>'; return; }
  card.innerHTML = `
    ${donateBkash ? `<div class="switch-row" style="border-top:none;"><div class="meta"><img src="/assets/logos/bkash.svg" alt="bKash" style="width:32px;height:32px;border-radius:9px;"><div><div style="font-weight:700;">bKash</div><div class="mono" style="font-size:13px;">${donateBkash}</div></div></div>
      <button class="btn btn-ghost btn-sm" onclick="PL.copyText('${donateBkash}', this)">📋</button></div>` : ""}
    ${donateNagad ? `<div class="switch-row"><div class="meta"><img src="/assets/logos/nagad.svg" alt="Nagad" style="width:32px;height:32px;border-radius:9px;"><div><div style="font-weight:700;">Nagad</div><div class="mono" style="font-size:13px;">${donateNagad}</div></div></div>
      <button class="btn btn-ghost btn-sm" onclick="PL.copyText('${donateNagad}', this)">📋</button></div>` : ""}
    ${donateNote ? `<p style="font-size:12.5px;color:var(--muted);margin-top:14px;">${donateNote}</p>` : ""}
  `;
})();
</script>
</body>
</html>
